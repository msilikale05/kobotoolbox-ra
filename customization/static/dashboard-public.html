<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard | Ramani Yangu</title>
<meta name="description" content="Resilience Academy Data Collection Dashboard">
<link rel="icon" href="/custom-static/images/favicon.png" type="image/png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #29292a; }
.ra-pub-header { background: #1a2a3a; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
.ra-pub-header img { height: 28px; }
.ra-pub-header h1 { font-size: 16px; font-weight: 600; flex: 1; }
.ra-pub-header .ra-pub-badge { background: rgba(255,255,255,0.15); padding: 3px 10px; border-radius: 12px; font-size: 11px; }
body.embed .ra-pub-header { display: none; }
body.embed { background: #f8fafc; }
.ra-pub-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; padding: 20px 24px; max-width: 1200px; margin: 0 auto; }
.ra-pub-widget { background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; overflow: hidden; }
.ra-pub-widget--full { grid-column: 1 / -1; }
.ra-pub-widget-header { padding: 12px 16px; font-size: 13px; font-weight: 600; color: #475569; border-bottom: 1px solid #f1f5f9; }
.ra-pub-widget-body { padding: 16px; }
.ra-pub-loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; color: #94a3b8; }
.ra-pub-loading::before { content: ""; width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: #54a8dc; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.ra-pub-error { text-align: center; padding: 60px 24px; color: #ef4444; }
.ra-pub-footer { text-align: center; padding: 16px; font-size: 11px; color: #94a3b8; }
body.embed .ra-pub-footer { display: none; }
@media (max-width: 768px) { .ra-pub-grid { grid-template-columns: 1fr; padding: 12px; } }
</style>
</head>
<body>
<div class="ra-pub-header">
  <img src="/custom-static/images/ra-logo.png" alt="Ramani Yangu">
  <h1 id="ra-pub-title">Dashboard</h1>
  <span class="ra-pub-badge">Live</span>
</div>
<div id="ra-pub-content">
  <div class="ra-pub-loading">Loading dashboard...</div>
</div>
<div class="ra-pub-footer">Powered by Ramani Yangu &mdash; Resilience Academy Data Collection Platform</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="/custom-static/js/ra-dashboard-public.js"></script>
</body>
</html>
