<!--
  Resilience Academy - Dashboard Footer
  ======================================
  This file is loaded by ra-dashboard-view.js and injected at the
  bottom of the dashboard page. Edit this file to customize the
  footer content without touching any JavaScript.

  Available variables (replaced at runtime):
    {{YEAR}} — current year
    {{BRAND}} — brand name (Ramani Yangu)
-->
<div class="ra-footer">
  <div class="ra-footer__inner">
    <div class="ra-footer__left">
      <img src="/custom-static/images/ra-logo.png" alt="Resilience Academy" class="ra-footer__logo">
      <span class="ra-footer__powered">Powered by Resilience Academy</span>
    </div>
    <div class="ra-footer__center">
      <a href="https://resilienceacademy.ac.tz" target="_blank" rel="noopener">About</a>
      <span class="ra-footer__sep">|</span>
      <a href="mailto:support@resilienceacademy.ac.tz">Support</a>
      <span class="ra-footer__sep">|</span>
      <a href="https://resilienceacademy.ac.tz" target="_blank" rel="noopener">Documentation</a>
    </div>
    <div class="ra-footer__right">
      <span>&copy; {{YEAR}} {{BRAND}}</span>
    </div>
  </div>
</div>
