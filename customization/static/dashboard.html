  // ── Widget: Submissions by Day of Week ──
  // ── Widget: Submissions by Hour of Day (SVG bar chart with form + date filters) ──
  function renderSubmissionsByHour(el, w, subs) {
    var cfg = w.config || {};
    var hoursToShow = parseInt(cfg.hours) || 24;
    var selId = 'ra-sbh-sel-' + w.id;
    var dateId = 'ra-sbh-date-' + w.id;
    var chartId = 'ra-sbh-chart-' + w.id;
    var summaryId = 'ra-sbh-sum-' + w.id;

    // Group submissions by form
    var formGroups = {};
    subs.forEach(function (s) {
      var uid = s._form_uid || '__unknown__';
      if (!formGroups[uid]) formGroups[uid] = { name: s._form_name || uid, subs: [] };
      formGroups[uid].subs.push(s);
    });
    var formKeys = Object.keys(formGroups);

    // Form selector
    var formOpts = '<option value="__all__">All Forms</option>';
    formKeys.forEach(function (uid) {
      formOpts += '<option value="' + esc(uid) + '">' + esc(formGroups[uid].name) + '</option>';
    });

    var chartType = cfg.chartType || 'bar';

    // Build date options: "All Days" + last 30 days
    var dateOpts = '<option value="">All Days</option>';
    for (var dd = 0; dd < 30; dd++) {
      var dt = new Date(Date.now() - dd * 86400000);
      var iso = dt.toISOString().split('T')[0];
      var label = dd === 0 ? 'Today' : (dd === 1 ? 'Yesterday' : dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }));
      dateOpts += '<option value="' + iso + '">' + label + '</option>';
    }

    el.innerHTML =
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center;">' +
        '<select id="' + selId + '" style="flex:1;min-width:120px;padding:6px 10px;border:1px solid #d1d5db;border-radius:4px;font-size:12px;background:#fff;color:#1e293b;">' + formOpts + '</select>' +
        '<select id="' + dateId + '" style="padding:6px 10px;border:1px solid #d1d5db;border-radius:4px;font-size:12px;background:#fff;color:#1e293b;min-width:130px;">' + dateOpts + '</select>' +
      '</div>' +
      '<div id="' + chartId + '" style="width:100%;overflow-x:auto;"></div>' +
      '<div id="' + summaryId + '" style="display:flex;justify-content:center;gap:24px;margin-top:8px;font-size:12px;color:#64748b;"></div>';

    function fmtHour(h) {
      if (h === 0) return '12am';
      if (h < 12) return h + 'am';
      if (h === 12) return '12pm';
      return (h - 12) + 'pm';
    }

    function drawChart() {
      var formVal = document.getElementById(selId).value;
      var dateVal = document.getElementById(dateId).value; // YYYY-MM-DD or empty
      var chartEl = document.getElementById(chartId);
      var sumEl = document.getElementById(summaryId);
      if (!chartEl) return;

      // Filter submissions
      var filtered = [];
      var srcKeys = (formVal === '__all__') ? formKeys : [formVal];
      srcKeys.forEach(function (uid) {
        var fg = formGroups[uid];
        if (fg) filtered = filtered.concat(fg.subs);
      });

      if (dateVal) {
        filtered = filtered.filter(function (s) {
          if (!s._submission_time) return false;
          return s._submission_time.substring(0, 10) === dateVal;
        });
      }

      // Count by hour
      var hours = [];
      for (var h = 0; h < 24; h++) hours.push(0);
      filtered.forEach(function (s) {
        if (!s._submission_time) return;
        var hour = new Date(s._submission_time).getHours();
        hours[hour]++;
      });

      // Determine which hours to show based on hoursToShow config
      var startHour = 0;
      var endHour = 24;
      if (hoursToShow < 24) {
        // Find the peak range of hoursToShow consecutive hours
        var bestStart = 0;
        var bestSum = 0;
        for (var s = 0; s <= 24 - hoursToShow; s++) {
          var sum = 0;
          for (var j = s; j < s + hoursToShow; j++) sum += hours[j];
          if (sum > bestSum) { bestSum = sum; bestStart = s; }
        }
        startHour = bestStart;
        endHour = bestStart + hoursToShow;
      }

      var displayHours = hours.slice(startHour, endHour);
      var numBars = displayHours.length;
      var maxC = Math.max.apply(null, displayHours) || 1;
      var peakIdx = displayHours.indexOf(maxC);
      var peakHour = startHour + peakIdx;

      // SVG chart — wider with more height
      var svgW = Math.max(numBars * 30, 480);
      var svgH = 180;
      var padL = 30;
      var padR = 10;
      var barW = Math.floor((svgW - padL - padR) / numBars);
      var barGap = 3;
      var chartTop = 20;
      var chartBottom = svgH - 24;
      var chartH = chartBottom - chartTop;

      var svgContent = '';

      // Baseline
      svgContent += '<line x1="' + padL + '" y1="' + chartBottom + '" x2="' + (padL + numBars * barW) + '" y2="' + chartBottom + '" stroke="#e2e8f0" stroke-width="1"/>';

      // Grid lines
      for (var g = 1; g <= 4; g++) {
        var gy = chartBottom - Math.round((g / 4) * chartH);
        svgContent += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (padL + numBars * barW) + '" y2="' + gy + '" stroke="#f0f0f0" stroke-width="0.5"/>';
      }

      if (chartType === 'line') {
        // ── Line chart ──
        var points = [];
        var dots = '';
        for (var i = 0; i < numBars; i++) {
          var val = displayHours[i];
          var px = padL + i * barW + barW / 2;
          var py = maxC > 0 ? chartBottom - Math.round((val / maxC) * chartH) : chartBottom;
          points.push(px + ',' + py);

          // Dots
          var isPeak = val === maxC && val > 0;
          dots += '<circle cx="' + px + '" cy="' + py + '" r="' + (isPeak ? 5 : 3.5) + '" fill="' + (isPeak ? '#54a8dc' : '#94a3b8') + '" stroke="#fff" stroke-width="1.5"/>';

          // Value label
          if (val > 0) {
            dots += '<text x="' + px + '" y="' + (py - 8) + '" text-anchor="middle" font-size="10" font-weight="' + (isPeak ? '700' : '400') + '" fill="' + (isPeak ? '#1e293b' : '#94a3b8') + '">' + val + '</text>';
          }

          // Hour label
          var labelInterval = numBars <= 6 ? 1 : (numBars <= 12 ? 2 : 3);
          if (i % labelInterval === 0) {
            svgContent += '<text x="' + px + '" y="' + (svgH - 6) + '" text-anchor="middle" font-size="10" fill="#94a3b8">' + fmtHour(startHour + i) + '</text>';
          }
        }

        // Area fill
        if (points.length > 1) {
          var areaPath = 'M' + (padL + barW / 2) + ',' + chartBottom + ' L' + points.join(' L') + ' L' + (padL + (numBars - 1) * barW + barW / 2) + ',' + chartBottom + ' Z';
          svgContent += '<path d="' + areaPath + '" fill="rgba(84,168,220,0.1)"/>';
        }

        // Line
        if (points.length > 1) {
          svgContent += '<polyline points="' + points.join(' ') + '" fill="none" stroke="#54a8dc" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>';
        }
        svgContent += dots;
      } else {
        // ── Bar chart ──
        for (var i = 0; i < numBars; i++) {
          var val = displayHours[i];
          var barH = maxC > 0 ? Math.round((val / maxC) * chartH) : 0;
          if (val > 0 && barH < 4) barH = 4;
          var x = padL + i * barW;
          var y = chartBottom - barH;
          var isPeak = val === maxC && val > 0;
          var color = isPeak ? '#54a8dc' : (val > 0 ? '#94a3b8' : '#e2e8f0');

          svgContent += '<rect x="' + (x + barGap / 2) + '" y="' + y + '" width="' + (barW - barGap) + '" height="' + barH + '" rx="2" fill="' + color + '"/>';

          if (val > 0) {
            svgContent += '<text x="' + (x + barW / 2) + '" y="' + (y - 5) + '" text-anchor="middle" font-size="10" font-weight="' + (isPeak ? '700' : '400') + '" fill="' + (isPeak ? '#1e293b' : '#94a3b8') + '">' + val + '</text>';
          }

          var labelInterval = numBars <= 6 ? 1 : (numBars <= 12 ? 2 : 3);
          if (i % labelInterval === 0) {
            svgContent += '<text x="' + (x + barW / 2) + '" y="' + (svgH - 6) + '" text-anchor="middle" font-size="10" fill="#94a3b8">' + fmtHour(startHour + i) + '</text>';
          }
        }
      }

      chartEl.innerHTML =
        '<svg viewBox="0 0 ' + svgW + ' ' + svgH + '" style="width:100%;min-width:360px;height:auto;font-family:inherit;">' +
          svgContent +
        '</svg>';

      var totalFiltered = filtered.length;
      var rangeLabel = (hoursToShow < 24) ? fmtHour(startHour) + ' - ' + fmtHour(endHour % 24) : 'Full day';
      sumEl.innerHTML =
        '<div>Peak: <strong style="color:#1e293b;">' + fmtHour(peakHour) + '</strong> (' + maxC + ')</div>' +
        '<div>Total: <strong style="color:#1e293b;">' + totalFiltered + '</strong></div>' +
        (hoursToShow < 24 ? '<div>Range: <strong style="color:#1e293b;">' + rangeLabel + '</strong></div>' : '');
    }

    // Initial draw
    drawChart();

    // Event listeners
    document.getElementById(selId).addEventListener('change', drawChart);
    document.getElementById(dateId).addEventListener('change', drawChart);
  }

  function renderSubmissionsByDay(el, w, subs) {
    var cfg = w.config || {};
    var chartType = cfg.chartType || 'bar';
    var filterDays = cfg.days || 0;
    var cutoff = filterDays ? new Date(Date.now() - filterDays * 86400000) : null;
    var dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    var counts = [0, 0, 0, 0, 0, 0, 0];
    subs.forEach(function (s) {
      if (!s._submission_time) return;
      var dt = new Date(s._submission_time);
      if (cutoff && dt < cutoff) return;
      counts[dt.getDay()]++;
    });
    var maxC = Math.max.apply(null, counts) || 1;

    if (chartType === 'line') {
      var svgW = 320, svgH = 150, padL = 10, padR = 10, padT = 22, padB = 24;
      var chartW = svgW - padL - padR, chartH = svgH - padT - padB;
      var stepX = chartW / 6;
      var pts = [], dots = '', lbls = '';
      for (var i = 0; i < 7; i++) {
        var px = padL + i * stepX;
        var py = maxC > 0 ? padT + chartH - (counts[i] / maxC) * chartH : padT + chartH;
        pts.push(px + ',' + py);
        var isPeak = counts[i] === maxC && counts[i] > 0;
        dots += '<circle cx="' + px + '" cy="' + py + '" r="' + (isPeak ? 5 : 3.5) + '" fill="' + (isPeak ? '#54a8dc' : '#94a3b8') + '" stroke="#fff" stroke-width="1.5"/>';
        dots += '<text x="' + px + '" y="' + (py - 8) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#29292a">' + counts[i] + '</text>';
        lbls += '<text x="' + px + '" y="' + (svgH - 5) + '" text-anchor="middle" font-size="11" fill="#64748b">' + dayNames[i] + '</text>';
      }
      var areaPath = 'M' + padL + ',' + (padT + chartH) + ' L' + pts.join(' L') + ' L' + (padL + 6 * stepX) + ',' + (padT + chartH) + ' Z';
      el.innerHTML = '<svg viewBox="0 0 ' + svgW + ' ' + svgH + '" style="width:100%;height:auto;font-family:inherit;">' +
        '<line x1="' + padL + '" y1="' + (padT + chartH) + '" x2="' + (svgW - padR) + '" y2="' + (padT + chartH) + '" stroke="#e2e8f0" stroke-width="1"/>' +
        '<path d="' + areaPath + '" fill="rgba(84,168,220,0.1)"/>' +
        '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#54a8dc" stroke-width="2.5" stroke-linejoin="round"/>' +
        dots + lbls + '</svg>';
    } else {
      el.innerHTML = '<div style="display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:10px;">' +
        dayNames.map(function (day, i) {
          var pct = Math.round((counts[i] / maxC) * 100);
          var isHighest = counts[i] === maxC && counts[i] > 0;
          var color = isHighest ? '#54a8dc' : '#cbd5e1';
          return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">' +
            '<span style="font-size:11px;font-weight:700;color:#29292a;">' + counts[i] + '</span>' +
            '<div style="width:100%;background:' + color + ';height:' + Math.max(pct, 3) + '%;border-radius:3px 3px 0 0;transition:height 0.3s;"></div>' +
            '<span style="font-size:11px;color:#64748b;">' + day + '</span></div>';
        }).join('') + '</div>';
    }
  }

  // ── Widget: Average Per Day ──
  function renderAvgPerDay(el, w, subs) {
    if (!subs.length) { el.innerHTML = '<p style="color:#94a3b8;text-align:center;">No submissions</p>'; return; }
    var cfg = w.config || {};
    var filterDays = cfg.days || 0;
    var cutoff = filterDays ? new Date(Date.now() - filterDays * 86400000) : null;

    var dates = {};
    subs.forEach(function (s) {
      if (!s._submission_time) return;
      if (cutoff && new Date(s._submission_time) < cutoff) return;
      var d = s._submission_time.split('T')[0];
      dates[d] = (dates[d] || 0) + 1;
    });
    var dayKeys = Object.keys(dates);
    if (!dayKeys.length) { el.innerHTML = '<p style="color:#94a3b8;text-align:center;">No submissions in period</p>'; return; }
    var dayCount = dayKeys.length;
    var totalInPeriod = 0;
    dayKeys.forEach(function (k) { totalInPeriod += dates[k]; });
    var avg = (totalInPeriod / dayCount).toFixed(1);
    var maxDay = dayKeys.reduce(function (a, b) { return dates[a] > dates[b] ? a : b; }, dayKeys[0]);
    var minDay = dayKeys.reduce(function (a, b) { return dates[a] < dates[b] ? a : b; }, dayKeys[0]);

    var display = (cfg.prefix || '') + avg + (cfg.suffix || '');
    el.innerHTML = '<div style="text-align:center;">' +
      '<div style="font-size:48px;font-weight:700;color:#54a8dc;">' + esc(display) + '</div>' +
      '<div style="font-size:13px;color:#64748b;margin-bottom:16px;">submissions per day' + (filterDays ? ' (last ' + filterDays + ' days)' : '') + '</div>' +
      '<div style="display:flex;justify-content:center;gap:24px;font-size:12px;color:#94a3b8;">' +
        '<div>Peak: <strong style="color:#29292a;">' + dates[maxDay] + '</strong> on ' + maxDay + '</div>' +
        '<div>Lowest: <strong style="color:#29292a;">' + dates[minDay] + '</strong> on ' + minDay + '</div>' +
      '</div></div>';
  }

  // ── Widget: Submissions by Period ──
  function renderSubmissionsPeriod(el, w, subs) {
    var periods = [
      { label: 'Past 7 days', days: 7 },
      { label: 'Past 31 days', days: 31 },
      { label: 'Past 3 months', days: 90 },
      { label: 'Past 12 months', days: 365 }
    ];
    var activePeriod = 0;

    function render(periodIdx) {
      var p = periods[periodIdx];
      var cutoff = new Date(Date.now() - p.days * 86400000);
      var filtered = subs.filter(function (s) {
        return s._submission_time && new Date(s._submission_time) >= cutoff;
      });

      var buckets = {};
      for (var i = p.days - 1; i >= 0; i--) {
        var d = new Date(Date.now() - i * 86400000);
        buckets[d.toISOString().split('T')[0]] = 0;
      }
      filtered.forEach(function (s) {
        var key = s._submission_time.split('T')[0];
        if (buckets[key] !== undefined) buckets[key]++;
      });

      var labels = Object.keys(buckets);
      var values = labels.map(function (l) { return buckets[l]; });
      var maxV = Math.max.apply(null, values) || 1;

      var tabs = periods.map(function (pp, idx) {
        var active = idx === periodIdx ? 'background:#54a8dc;color:#fff;' : 'background:#f1f5f9;color:#64748b;';
        return '<button style="padding:6px 12px;border:none;border-radius:4px;font-size:12px;cursor:pointer;' + active + '" data-pidx="' + idx + '">' + pp.label + '</button>';
      }).join('');

      var chartType = (w.config || {}).chartType || 'bar';
      var chartHtml = '';

      if (chartType === 'line') {
        var svgW2 = 700, svgH2 = 120, padL2 = 5, padR2 = 5, padT2 = 10, padB2 = 5;
        var cW = svgW2 - padL2 - padR2, cH = svgH2 - padT2 - padB2;
        var stepX = labels.length > 1 ? cW / (labels.length - 1) : cW;
        var pts2 = [], dots2 = '';
        for (var li = 0; li < labels.length; li++) {
          var px2 = padL2 + li * stepX;
          var py2 = maxV > 0 ? padT2 + cH - (values[li] / maxV) * cH : padT2 + cH;
          pts2.push(px2 + ',' + py2);
        }
        var areaP = 'M' + padL2 + ',' + (padT2 + cH) + ' L' + pts2.join(' L') + ' L' + (padL2 + (labels.length - 1) * stepX) + ',' + (padT2 + cH) + ' Z';
        chartHtml = '<div style="height:120px;margin-bottom:8px;"><svg viewBox="0 0 ' + svgW2 + ' ' + svgH2 + '" style="width:100%;height:100%;" preserveAspectRatio="none">' +
          '<path d="' + areaP + '" fill="rgba(84,168,220,0.15)"/>' +
          '<polyline points="' + pts2.join(' ') + '" fill="none" stroke="#54a8dc" stroke-width="2"/>' +
          '</svg></div>';
      } else {
        var barW = Math.max(2, Math.floor(700 / labels.length) - 2);
        var bars = values.map(function (v) {
          var h = Math.round((v / maxV) * 100);
          return '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-width:' + barW + 'px;">' +
            '<div style="width:80%;height:' + Math.max(h, 2) + '%;background:#54a8dc;border-radius:2px 2px 0 0;"></div></div>';
        }).join('');
        chartHtml = '<div style="display:flex;align-items:flex-end;height:120px;gap:1px;margin-bottom:8px;">' + bars + '</div>';
      }

      var totalP = filtered.length;

      el.innerHTML = '<div style="display:flex;gap:8px;margin-bottom:12px;">' + tabs + '</div>' +
        chartHtml +
        '<div style="display:flex;gap:24px;margin-top:8px;">' +
          '<div style="flex:1;text-align:center;padding:12px;background:#f8fafc;border-radius:6px;">' +
            '<div style="font-size:32px;font-weight:700;color:#54a8dc;">' + totalP + '</div>' +
            '<div style="font-size:12px;color:#94a3b8;">in ' + p.label.toLowerCase() + '</div>' +
          '</div>' +
          '<div style="flex:1;text-align:center;padding:12px;background:#f8fafc;border-radius:6px;">' +
            '<div style="font-size:32px;font-weight:700;color:#54a8dc;">' + subs.length + '</div>' +
            '<div style="font-size:12px;color:#94a3b8;">total all time</div>' +
          '</div>' +
        '</div>';

      el.querySelectorAll('[data-pidx]').forEach(function (btn) {
        btn.addEventListener('click', function () { render(parseInt(this.getAttribute('data-pidx'))); });
      });
    }

    render(activePeriod);
  }

  // ── Widget: Geographic Coverage ──
  function loadLeafletForGeo(callback) {
    if (window.L && window.L.map) { callback(); return; }
    if (!document.querySelector('link[href*="leaflet"]')) {
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
      document.head.appendChild(css);
    }
    if (!document.querySelector('script[src*="leaflet"]')) {
      var script = document.createElement('script');
      script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      script.onload = function () {
        var tries = 0;
        var iv = setInterval(function () {
          if ((window.L && window.L.map) || tries > 40) { clearInterval(iv); callback(); }
          tries++;
        }, 100);
      };
      document.head.appendChild(script);
    } else {
      var tries = 0;
      var iv = setInterval(function () {
        if ((window.L && window.L.map) || tries > 40) { clearInterval(iv); callback(); }
        tries++;
      }, 100);
    }
  }

  function renderGeoCoverage(el, w, subs) {
    var mapId = 'ra-geo-map-' + w.id;
    var selectId = 'ra-geo-sel-' + w.id;
    var countId = 'ra-geo-count-' + w.id;

    var formGroups = {};
    subs.forEach(function (s) {
      var uid = s._form_uid || '__unknown__';
      if (!formGroups[uid]) formGroups[uid] = { name: s._form_name || uid, subs: [] };
      formGroups[uid].subs.push(s);
    });
    var formKeys = Object.keys(formGroups);

    var formsWithGeo = formKeys.filter(function (uid) {
      return formGroups[uid].subs.some(function (s) {
        var g = s._geolocation;
        if (!g || !g[0] || !g[1]) return false;
        var la = parseFloat(g[0]), lo = parseFloat(g[1]);
        return !isNaN(la) && !isNaN(lo) && !(la === 0 && lo === 0) && Math.abs(la) <= 90 && Math.abs(lo) <= 180;
      });
    });

    // Build color map: form uid -> color (stable across renders)
    var formColorMap = {};
    formsWithGeo.forEach(function (uid, idx) {
      formColorMap[uid] = GEO_COLORS[idx % GEO_COLORS.length];
    });

    var optionsHtml = '<option value="__all__">All Forms (' + formsWithGeo.length + ')</option>';
    formsWithGeo.forEach(function (uid) {
      var color = formColorMap[uid];
      optionsHtml += '<option value="' + esc(uid) + '" style="color:' + color + ';font-weight:600;">' +
        '\u25CF ' + esc(formGroups[uid].name) + '</option>';
    });

    el.innerHTML =
      '<div style="margin-bottom:8px;display:flex;align-items:center;gap:8px;">' +
        '<label style="font-size:12px;color:#64748b;white-space:nowrap;">Show form:</label>' +
        '<select id="' + selectId + '" style="flex:1;min-width:140px;padding:6px 10px;border:1px solid #d1d5db;border-radius:4px;font-size:12px;color:#1e293b;background:#fff;">' +
          optionsHtml +
        '</select>' +
        '<span id="' + countId + '" style="font-size:11px;color:#94a3b8;white-space:nowrap;"></span>' +
      '</div>' +
      '<div id="' + mapId + '" style="width:100%;height:320px;border-radius:6px;border:1px solid #e2e8f0;background:#e8ecf0;position:relative;"></div>';

    // Update select color to match selected option
    function syncSelectColor() {
      var sel = document.getElementById(selectId);
      if (!sel) return;
      var opt = sel.options[sel.selectedIndex];
      sel.style.color = (sel.value === '__all__') ? '#1e293b' : (opt && opt.style.color || '#1e293b');
    }
    syncSelectColor();

    if (!formsWithGeo.length) {
      document.getElementById(mapId).innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:13px;">No GPS data available</div>';
      return;
    }

    loadLeafletForGeo(function () {
      var L = window.L;
      if (!L || !L.map) return;

      setTimeout(function () {
        var container = document.getElementById(mapId);
        if (!container || container.offsetWidth === 0) return;

        if (_geoMapInstances[w.id]) {
          try { _geoMapInstances[w.id].remove(); } catch (e) {}
          _geoMapInstances[w.id] = null;
        }

        var map = L.map(mapId, {
          center: [-6.8, 39.28],
          zoom: 6,
          zoomControl: false,
          scrollWheelZoom: false,
          doubleClickZoom: false,
          boxZoom: false,
          keyboard: false,
          dragging: false,
          touchZoom: false,
          tap: false,
          attributionControl: false
        });
        _geoMapInstances[w.id] = map;

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          maxZoom: 19
        }).addTo(map);

        L.control.attribution({ position: 'bottomright', prefix: false })
          .addAttribution('&copy; OSM')
          .addTo(map);

        var activeLayer = null;

        function showPoints(filterUid) {
          if (activeLayer) { map.removeLayer(activeLayer); activeLayer = null; }
          activeLayer = L.layerGroup().addTo(map);

          var bounds = [];
          var total = 0;
          var keysToShow = (filterUid === '__all__') ? formsWithGeo : [filterUid];

          keysToShow.forEach(function (uid) {
            var fg = formGroups[uid];
            if (!fg) return;
            var color = formColorMap[uid] || GEO_COLORS[0];

            fg.subs.forEach(function (s) {
              var geo = s._geolocation;
              if (!geo || !geo[0] || !geo[1]) return;
              var lat = parseFloat(geo[0]), lon = parseFloat(geo[1]);
              if (isNaN(lat) || isNaN(lon) || (lat === 0 && lon === 0) || Math.abs(lat) > 90 || Math.abs(lon) > 180) return;

              L.circleMarker([lat, lon], {
                radius: 5,
                fillColor: color,
                color: '#fff',
                weight: 1.5,
                opacity: 1,
                fillOpacity: 0.8,
                interactive: false
              }).addTo(activeLayer);

              bounds.push([lat, lon]);
              total++;
            });
          });

          var countEl = document.getElementById(countId);
          if (countEl) countEl.textContent = total + ' points';

          if (bounds.length) {
            map.flyToBounds(bounds, { padding: [25, 25], maxZoom: 14, duration: 0.8 });
          }
        }

        // Add legend control inside the map (bottom-left)
        var legendControl = L.control({ position: 'bottomleft' });
        legendControl.onAdd = function () {
          var div = L.DomUtil.create('div', 'ra-geo-legend-ctrl');
          div.style.cssText = 'background:rgba(255,255,255,0.92);padding:6px 10px;border-radius:4px;font-size:10px;line-height:1.6;box-shadow:0 1px 4px rgba(0,0,0,0.2);max-width:180px;';
          return div;
        };
        legendControl.addTo(map);

        function updateMapLegend(filterUid) {
          var container = legendControl.getContainer();
          if (!container) return;
          var items = (filterUid === '__all__') ? formsWithGeo : [filterUid];
          container.innerHTML = items.map(function (uid) {
            var c = formColorMap[uid] || '#94a3b8';
            var n = formGroups[uid] ? formGroups[uid].name : uid;
            return '<div style="display:flex;align-items:center;gap:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' +
              '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:' + c + ';flex-shrink:0;"></span>' +
              '<span style="overflow:hidden;text-overflow:ellipsis;">' + esc(n) + '</span></div>';
          }).join('');
        }
        updateMapLegend('__all__');

        showPoints('__all__');

        var selectEl = document.getElementById(selectId);
        if (selectEl) {
          selectEl.addEventListener('change', function () {
            showPoints(this.value);
            updateMapLegend(this.value);
            syncSelectColor();
          });
        }

        setTimeout(function () { map.invalidateSize(); }, 300);
      }, 150);
    });
  }

  // ── Widget: Form Status ──
  function renderFormStatus(el, w) {
    var deployed = 0, draft = 0, archived = 0;
    formsCache.forEach(function (f) {
      if (f.deployment_status === 'deployed') deployed++;
      else if (f.deployment_status === 'archived') archived++;
      else draft++;
    });
    var total = formsCache.length;

    el.innerHTML = '<div style="display:flex;gap:12px;">' +
      '<div style="flex:1;text-align:center;padding:16px;background:#e8f8f0;border-radius:8px;">' +
        '<div style="font-size:28px;font-weight:700;color:#27ae60;">' + deployed + '</div>' +
        '<div style="font-size:12px;color:#27ae60;">Deployed</div>' +
      '</div>' +
      '<div style="flex:1;text-align:center;padding:16px;background:#fef3e2;border-radius:8px;">' +
        '<div style="font-size:28px;font-weight:700;color:#f39c12;">' + draft + '</div>' +
        '<div style="font-size:12px;color:#f39c12;">Draft</div>' +
      '</div>' +
      '<div style="flex:1;text-align:center;padding:16px;background:#f1f5f9;border-radius:8px;">' +
        '<div style="font-size:28px;font-weight:700;color:#94a3b8;">' + archived + '</div>' +
        '<div style="font-size:12px;color:#94a3b8;">Archived</div>' +
      '</div>' +
      '<div style="flex:1;text-align:center;padding:16px;background:#e8f4fd;border-radius:8px;">' +
        '<div style="font-size:28px;font-weight:700;color:#54a8dc;">' + total + '</div>' +
        '<div style="font-size:12px;color:#54a8dc;">Total</div>' +
      '</div>' +
    '</div>';
  }

  // ── Auto Refresh ──
  function startRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(function () { loadAndRender(); }, REFRESH_INTERVAL);
  }

  // ── Bootstrap ──
  function bootstrap() {
    checkAuth().then(function () {
      hideLoading();
      initPage();
      loadAndRender();
      startRefresh();
    }).catch(function () {
      // Auth redirects are handled inside checkAuth
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', bootstrap);
  } else {
    bootstrap();
  }
})();
</script>
</body>
